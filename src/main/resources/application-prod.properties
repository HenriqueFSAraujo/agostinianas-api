# ========== SERVER ==========
# usa a porta dinâmica fornecida pelo Railway (fallback 8080 localmente)


# ========== DATASOURCE ==========
# substitui pelos nomes de variáveis que o Railway já fornece (sem underscore)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1


# ========== JPA / HIBERNATE ==========
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.sql.init.mode=ALWAYS

# ========== SESSIONS JDBC ==========
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never






